name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: [22.13.0, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm install --global @anthropic-ai/claude-code@2.1.220
      - run: npm install --global @openai/codex@0.144.1
      - run: npm test
      - run: npm run test:coverage
      - run: npm run test:entry-modes
      - run: npm run test:claude-real
      - run: npm run test:codex-real
      - run: npm audit
      - run: npm pack --dry-run
      - name: Packed CLI smoke for RouterLab and LLM
        shell: bash
        run: |
          TARBALL=$(npm pack --silent)
          PREFIX="$RUNNER_TEMP/wrapper-scionos-install"
          npm install --prefix "$PREFIX" "./$TARBALL"
          "$PREFIX/node_modules/.bin/wrapper-scionos" --version
          "$PREFIX/node_modules/.bin/wrapper-scionos" --service llm --version
          "$PREFIX/node_modules/.bin/wrapper-scionos" --service llm doctor --json
          "$PREFIX/node_modules/.bin/wrapper-scionos" doctor --service llm --json
          "$PREFIX/node_modules/.bin/scionos" --service routerlab --version
          npx --yes --package "./$TARBALL" wrapper-scionos --version
          npx --yes --package "./$TARBALL" wrapper-scionos --service llm --version
          npx --yes --package "./$TARBALL" scionos --service routerlab --version
