name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  keychain:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Real Keychain temporary account
        shell: bash
        run: |
          mkdir -p .test-logs
          npm run test:keychain-real 2>&1 | tee .test-logs/keychain.log
      - name: Preserve Keychain diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: keychain-macos
          path: .test-logs/
          if-no-files-found: ignore
          retention-days: 14

  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: [22.13.0, '22', 23.5.0, '24', '25', '26']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm install --global @anthropic-ai/claude-code@2.1.296
      - run: npm install --global @openai/codex@0.144.1
      - name: Unit tests with redirected output
        shell: bash
        run: |
          mkdir -p .test-logs
          npm test 2>&1 | tee .test-logs/unit.log
      - name: Coverage
        shell: bash
        run: npm run test:coverage 2>&1 | tee .test-logs/coverage.log
      - run: npm run test:entry-modes
      - run: npm run test:claude-real
      - run: npm run test:codex-real
      - name: Real Keychain temporary account
        if: runner.os == 'macOS'
        shell: bash
        run: npm run test:keychain-real 2>&1 | tee .test-logs/keychain.log
      - run: npm audit
      - run: npm pack --dry-run
      - name: Packed CLI smoke for RouterLab and LLM
        shell: bash
        run: |
          TARBALL=$(npm pack --silent)
          PREFIX="$RUNNER_TEMP/wrapper-scionos-install"
          npm install --prefix "$PREFIX" "./$TARBALL"
          "$PREFIX/node_modules/.bin/wrapper-scionos" --version
          "$PREFIX/node_modules/.bin/wrapper-scionos" --service llm --version
          "$PREFIX/node_modules/.bin/wrapper-scionos" --service llm doctor --json
          "$PREFIX/node_modules/.bin/wrapper-scionos" doctor --service llm --json
          "$PREFIX/node_modules/.bin/scionos" --service routerlab --version
          npx --yes --package "./$TARBALL" wrapper-scionos --version
          npx --yes --package "./$TARBALL" wrapper-scionos --service llm --version
          npx --yes --package "./$TARBALL" scionos --service routerlab --version
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tests-${{ matrix.os }}-${{ matrix.node }}
          path: .test-logs/
          if-no-files-found: ignore
          retention-days: 14

  opencode:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: [22.13.0, '24', '26']
        package: ['opencode-ai@1.18.30', '@opencode/cli@2.0.27']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm install --global ${{ matrix.package }}
      - name: Real model path auth streaming and read tool
        shell: bash
        run: |
          mkdir -p .test-logs
          npm run test:opencode-real 2>&1 | tee .test-logs/opencode.log
          exit "${PIPESTATUS[0]}"
      - name: Preserve OpenCode diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-${{ matrix.os }}-${{ matrix.node }}-${{ strategy.job-index }}
          path: .test-logs/
          if-no-files-found: ignore
          retention-days: 14
